name: Bump personal favicon to v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-favicon-v3.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump favicon cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'href="/favicon.svg?v=2"'
          new = 'href="/favicon.svg?v=3"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one v2 favicon reference, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh favicon after background color update"
          git push
