name: Add personal favicon and update PingBuoy link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-personal-favicon.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update site
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old_url = 'href="https://pingbuoy.com/"'
          new_url = 'href="https://pingbuoy.rosalindgash.com/"'
          if old_url not in text:
              raise SystemExit('PingBuoy URL not found')
          text = text.replace(old_url, new_url, 1)

          favicon = '    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />\n'
          if 'rel="icon"' not in text:
              marker = '    <title>Rosalind R. Gash | Product Engineer & Researcher</title>\n'
              if marker not in text:
                  raise SystemExit('Title marker not found')
              text = text.replace(marker, marker + favicon, 1)

          index.write_text(text, encoding='utf-8')

          Path('favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#7c3f58"/>
  <path d="M14 14h15c9 0 15 5 15 13 0 5-3 9-8 11l10 12H35L26 39h-3v11H14V14zm9 8v10h6c4 0 6-2 6-5s-2-5-6-5h-6z" fill="#fffaf5"/>
  <path d="M51 38h-9v-7h17v20c-4 2-8 3-13 3-10 0-17-6-17-16 0-1 0-2 .2-3h9.2c-.2 1-.4 2-.4 3 0 5 3 8 8 8 2 0 4-.3 5-1v-7z" fill="#fffaf5"/>
  <circle cx="52" cy="13" r="5" fill="#0f766e"/>
</svg>\n''', encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg
          git commit -m "Update PingBuoy link and add personal SVG favicon"
          git push
