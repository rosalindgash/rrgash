name: Repair personal site updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-personal-site.yml'

permissions:
  contents: write

jobs:
  repair-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good page and apply targeted edits
        run: |
          git show e927c8fc8941d38fc1d6a749553ff841ea0e0ce3:index.html > index.html
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('href="https://pingbuoy.com/"', 'href="https://pingbuoy.rosalindgash.com/"'),
              ('src="assets/images/headshot.png"', 'src="assets/images/rrgash_sm.png"'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new, 1)

          favicon = '    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />\n'
          title = '    <title>Rosalind R. Gash | Product Engineer & Researcher</title>\n'
          if favicon not in text:
              if text.count(title) != 1:
                  raise SystemExit('Expected exactly one title marker')
              text = text.replace(title, title + favicon, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit targeted site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update PingBuoy link, portrait, and favicon"
          git push
