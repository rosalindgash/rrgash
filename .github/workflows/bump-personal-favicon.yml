name: Bump personal favicon cache key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-personal-favicon.yml'

permissions:
  contents: write

jobs:
  bump-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update favicon version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'href="/favicon.svg?v=1"'
          new = 'href="/favicon.svg?v=2"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one favicon v1 reference, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh personal favicon cache key"
          git push
